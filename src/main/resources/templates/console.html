<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Console for the multi-tenant dynamic RBAC authorization engine.">
    <title th:text="|${appName} · Authorization console|">Authorization console</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/console.css}">
    <script th:src="@{/js/console.js}" defer></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open navigation"
            aria-controls="sidebar" aria-expanded="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a class="brand" href="#/overview">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="8"/>
            <path d="M16 6.5 9 9.3v5.2c0 4.4 3 8.3 7 9.5 4-1.2 7-5.1 7-9.5V9.3z"/>
            <path d="m12.8 15.6 2.3 2.3 4.3-4.6"/>
        </svg>
        <span class="brand-text">
            <span class="brand-name" th:text="${appName}">Multi-Tenant</span>
            <span class="brand-sub">Authorization console</span>
        </span>
    </a>
    <span class="env" th:text="${profile}" title="Active Spring profile">local</span>
    <div class="topbar-spacer"></div>
    <div class="session" id="session"></div>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Change theme"></button>
</header>

<div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Sections"></nav>
    <div class="overlay" id="overlay" hidden></div>
    <main class="main" id="main"></main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<noscript><p class="noscript">This console needs JavaScript enabled.</p></noscript>
</body>
</html>
